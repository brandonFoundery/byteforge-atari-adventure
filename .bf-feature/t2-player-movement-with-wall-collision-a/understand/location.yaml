schema: location-v1
feature_slug: t2-player-movement-with-wall-collision-a
feature_witness: b6731a13a9b00140

in_scope:
  - path: adventure.py
    mutated: true
    reason: |
      Main game module. Hosts the PLAYER_SPEED constant, the wall-clamp boundary
      constants (_X_MIN, _X_MAX, _Y_MIN, _Y_MAX), the move_player(x, y, keys_pressed)
      function implementing 4-direction arrow-key input, and the run_game_loop
      integration that calls pygame.key.get_pressed() each frame and applies the
      result via move_player before rendering.
  - path: tests/test_movement.py
    mutated: true
    reason: |
      Dedicated test module for T2 (C01 — player movement). Covers PLAYER_SPEED
      constant, each of the 4 directional axes (right/left/up/down), the four
      wall-clamp boundaries (left/right/top/bottom), and the no-keys-no-motion
      invariant.
  - path: tests/test_adventure.py
    mutated: false
    reason: |
      Pre-existing T1 tests for window init, initial player position, and ESC
      loop exit. Must continue to pass; T2 changes interact with run_game_loop
      so this file is in the regression scope even though it is not modified.
  - path: tests/conftest.py
    mutated: false
    reason: |
      Test environment configuration (e.g. SDL_VIDEODRIVER=dummy for headless
      pygame). T2 tests inherit this; behavior must remain compatible.

