discrepancies:
  - requested: "arrow-key input handler"
    found: "adventure.move_player(x, y, keys_pressed)"
    note: |
      Already implemented in working tree (commit 969823a). This understanding
      pass is retrospective — the feature exists and is being grounded for the
      Diamond audit trail rather than green-fielded.
  - requested: "wall collision"
    found: "max/min clamp against _X_MIN/_X_MAX/_Y_MIN/_Y_MAX inside move_player"
    note: |
      Implemented as boundary clamping (not swept collision). Walls are the
      fixed perimeter rectangles drawn by draw_room; clamp bounds derive from
      WALL_THICKNESS, LOGICAL_WIDTH/HEIGHT, and PLAYER_SIZE.

