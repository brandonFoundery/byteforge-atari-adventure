schema: requirements-v1
feature_slug: t2-player-movement-with-wall-collision-a
feature_witness: b6731a13a9b00140

requirements:
  - req_id: REQ-61A105
    source_story_id: STORY-43ac67
    assertion: "PLAYER_SPEED constant exists in adventure module with a positive integer value"

  - req_id: REQ-077E89
    source_story_id: STORY-43ac67
    assertion: "adventure.move_player accepts x, y, and keys_pressed parameters and returns updated x, y coordinates"

  - req_id: REQ-9463A3
    source_story_id: STORY-43ac67
    assertion: "pressing K_RIGHT returns x incremented by PLAYER_SPEED"

  - req_id: REQ-7B8D30
    source_story_id: STORY-43ac67
    assertion: "pressing K_LEFT returns x decremented by PLAYER_SPEED"

  - req_id: REQ-77D5D3
    source_story_id: STORY-43ac67
    assertion: "pressing K_DOWN returns y incremented by PLAYER_SPEED"

  - req_id: REQ-D70100
    source_story_id: STORY-43ac67
    assertion: "pressing K_UP returns y decremented by PLAYER_SPEED"

  - req_id: REQ-68475D
    source_story_id: STORY-d7cd6a
    assertion: "move_player with no keys pressed returns x and y unchanged"

  - req_id: REQ-DEEA15
    source_story_id: STORY-d7cd6a
    assertion: "run_game_loop calls pygame.key.get_pressed each frame and passes result to move_player"

  - req_id: REQ-A617E0
    source_story_id: STORY-834b3a
    assertion: "pressing K_LEFT and K_RIGHT simultaneously returns x unchanged (net zero x-delta)"

  - req_id: REQ-995830
    source_story_id: STORY-834b3a
    assertion: "pressing K_UP and K_DOWN simultaneously returns y unchanged (net zero y-delta)"
