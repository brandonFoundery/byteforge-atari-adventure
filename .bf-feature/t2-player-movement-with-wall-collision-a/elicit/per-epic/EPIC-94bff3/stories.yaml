    title: Arrow-key input detection and directional dispatch
    in_scope_files:
      - adventure.py
    acceptance_criteria:
      - "adventure.PLAYER_SPEED returns a positive integer value"
      - "adventure.move_player accepts x, y, and keys_pressed parameters and returns updated x, y coordinates"
      - "pressing K_RIGHT returns x incremented by PLAYER_SPEED"
      - "pressing K_LEFT returns x decremented by PLAYER_SPEED"
      - "pressing K_DOWN returns y incremented by PLAYER_SPEED"
      - "pressing K_UP returns y decremented by PLAYER_SPEED"

