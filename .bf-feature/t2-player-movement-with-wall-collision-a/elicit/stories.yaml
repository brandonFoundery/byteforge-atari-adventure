- schema: story-v1
  story_id: STORY-2ca379
  epic_id: EPIC-436002
  title: Wall boundary constants derived from room geometry
  in_scope_files:
  - adventure.py
  acceptance_criteria:
  - adventure._X_MIN returns the value of WALL_THICKNESS
  - adventure._X_MAX returns LOGICAL_WIDTH minus WALL_THICKNESS minus PLAYER_SIZE
  - adventure._Y_MIN returns the value of WALL_THICKNESS
  - adventure._Y_MAX returns LOGICAL_HEIGHT minus WALL_THICKNESS minus PLAYER_SIZE
- schema: story-v1
  story_id: STORY-b90a87
  epic_id: EPIC-436002
  title: Move denied when player reaches wall boundary
  in_scope_files:
  - adventure.py
  acceptance_criteria:
  - move_player returns x clamped to range _X_MIN to _X_MAX after applying key input
  - move_player returns y clamped to range _Y_MIN to _Y_MAX after applying key input
  - attempting to move right past _X_MAX returns x equal to _X_MAX
  - attempting to move left past _X_MIN returns x equal to _X_MIN
  - attempting to move down past _Y_MAX returns y equal to _Y_MAX
  - attempting to move up past _Y_MIN returns y equal to _Y_MIN
- schema: story-v1
  story_id: STORY-43ac67
  epic_id: EPIC-94bff3
  title: Arrow-key input detection and directional dispatch
  in_scope_files:
  - adventure.py
  acceptance_criteria:
  - adventure.PLAYER_SPEED returns a positive integer value
  - adventure.move_player accepts x, y, and keys_pressed parameters and returns updated
    x, y coordinates
  - pressing K_RIGHT returns x incremented by PLAYER_SPEED
  - pressing K_LEFT returns x decremented by PLAYER_SPEED
  - pressing K_DOWN returns y incremented by PLAYER_SPEED
  - pressing K_UP returns y decremented by PLAYER_SPEED
- schema: story-v1
  story_id: STORY-834b3a
